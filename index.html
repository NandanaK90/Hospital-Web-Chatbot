<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My RAG Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; }
    #app { max-width: 640px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
    h1 { font-size: 18px; padding: 14px 16px; margin: 0; background: #1f3a5f; color: white; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { max-width: 80%; padding: 10px 14px; margin: 8px 0; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #1f3a5f; color: white; margin-left: auto; }
    .bot { background: white; border: 1px solid #dde1e6; }
    .src { font-size: 12px; color: #667; margin-top: 6px; }
    #form { display: flex; gap: 8px; padding: 12px; background: white; border-top: 1px solid #dde1e6; }
    #input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccd; border-radius: 8px; }
    button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 8px; background: #1f3a5f; color: white; cursor: pointer; }
    button:disabled { background: #99a; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Ask me about the documents</h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" placeholder="Type your question..." autocomplete="off" required>
      <button id="send">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const messages = document.getElementById("messages");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    addMessage("Hello! Ask me anything about the documents.", "bot");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addMessage("Thinking...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question })
        });
        const data = await response.json();

        thinking.textContent = data.answer;
        if (data.sources.length > 0) {
          const src = document.createElement("div");
          src.className = "src";
          src.textContent = "Sources: " + data.sources.join(", ");
          thinking.appendChild(src);
        }
      } catch (error) {
        thinking.textContent = "Something went wrong. Is the server running?";
      }
      sendBtn.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
